name: Pontoon Dashboard — hourly refresh + Pages deploy

# Hourly: rebuild the live dashboard AND the weekly-report image from live GHL data
# (read-only), then deploy both to GitHub Pages:
#   /            -> interactive dashboard (embed in GHL)
#   /report.png  -> weekly snapshot image (embed in the GHL weekly email)
# report.png shows the last COMPLETED Mon-Sun week, so it only changes each Monday.
# Token comes from the GHL_PIT secret; no data or credentials are committed.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build dashboard + weekly report image
        env:
          GHL_PIT: ${{ secrets.GHL_PIT }}
        run: |
          python3 refresh.py
          python3 weekly_report.py
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 render_png.py
          mkdir -p _site
          cp dashboard.html _site/index.html
          cp report.png _site/report.png

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
